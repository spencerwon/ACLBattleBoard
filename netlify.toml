# The site is plain static files at the repo root; the only server code is in netlify/functions.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Share links like /b/spencer26 open the same page in view-only mode
[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

# Keep the stats page out of search engines.
[[headers]]
  for = "/stats.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
